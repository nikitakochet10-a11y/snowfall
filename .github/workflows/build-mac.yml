name: Build and test macOS app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            name: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build app
        run: bash build_mac.sh

      - name: Open real windows
        continue-on-error: true
        run: |
          osascript -e 'tell application "TextEdit" to activate' -e 'tell application "TextEdit" to make new document' || true
          open -a Calculator || true
          open -a Finder || true
          sleep 4

      - name: Platform check
        continue-on-error: true
        run: |
          source .venv/bin/activate
          mkdir -p report
          python - <<'PY' 2>&1 | tee report/platform_check.txt
          import sys
          from PySide6.QtWidgets import QApplication
          app = QApplication(sys.argv)
          import Snowfall as S
          from Quartz import CGWindowListCopyWindowInfo, kCGWindowListOptionAll, kCGNullWindowID
          raw = CGWindowListCopyWindowInfo(kCGWindowListOptionAll, kCGNullWindowID) or []
          print("RAW windows (all layers):", len(raw))
          for d in raw[:40]:
              b = d.get("kCGWindowBounds") or {}
              print(" layer", d.get("kCGWindowLayer"), "onscreen", d.get("kCGWindowIsOnscreen"), "alpha", d.get("kCGWindowAlpha"),
                    "owner", d.get("kCGWindowOwnerName"), "name", repr(d.get("kCGWindowName")),
                    "size", int(b.get("Width", 0)), "x", int(b.get("Height", 0)), "at", int(b.get("X", 0)), int(b.get("Y", 0)))
          print("taskbar_top:", S.taskbar_top())
          wins = S.list_windows(set())
          print("FILTERED windows:", len(wins))
          for w in wins[:10]:
              print(" ", w, S.exe_of(w[0]), repr(S.window_title(w[0])))
          PY

      - name: Run app and screenshots
        continue-on-error: true
        run: |
          mkdir -p report
          ./dist/Snowfall.app/Contents/MacOS/Snowfall > report/run.log 2>&1 &
          APP=$!
          sleep 20
          screencapture -x report/screen1.png || true
          sleep 10
          screencapture -x report/screen2.png || true
          if kill -0 $APP 2>/dev/null; then echo "APP RUNNING" >> report/run.log; else echo "APP CRASHED" >> report/run.log; fi
          kill $APP 2>/dev/null || true
          echo "===== run.log ====="
          cat report/run.log
          ls -la report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Snowfall-mac-${{ matrix.name }}
          path: |
            dist/Snowfall-mac.zip
            report/
