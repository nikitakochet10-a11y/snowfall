name: Build and test macOS app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            name: arm64-macos26
          - os: macos-15
            name: arm64
          - os: macos-15-intel
            name: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build app
        run: bash build_mac.sh

      - name: Scenarios (screenshots and video)
        continue-on-error: true
        run: |
          set +e
          mkdir -p report
          osascript <<'OSA' || echo "textedit setup failed"
          with timeout of 15 seconds
            tell application "TextEdit"
              activate
              make new document
              set bounds of window 1 to {60, 80, 520, 360}
            end tell
          end timeout
          OSA
          open -a Finder
          sleep 2
          osascript <<'OSA' || echo "finder setup failed"
          with timeout of 15 seconds
            tell application "Finder"
              if (count of Finder windows) is 0 then make new Finder window
              set bounds of front Finder window to {420, 220, 900, 540}
            end tell
          end timeout
          OSA
          sleep 3

          run_scenario() {
            name=$1; demo=$2; wait_s=$3
            SNOWFALL_DEMO="$demo" ./dist/Snowfall.app/Contents/MacOS/Snowfall > report/$name.log 2>&1 &
            APP=$!
            sleep $wait_s
            screencapture -x report/$name.png || true
            kill $APP 2>/dev/null || true
            sleep 3
          }
          run_scenario base "page=0,panel=0" 30
          run_scenario garland "page=6,garland=static,panel=0" 20
          names=(snow tools plow cat snowman tree garland windows system)
          for i in 0 1 2 3 4 5 6 7 8; do
            extra=""
            if [ $i -eq 4 ] || [ $i -eq 5 ]; then extra=",tree=1,snowman=1"; fi
            if [ $i -eq 6 ]; then extra=",garland=static"; fi
            run_scenario "tab_${i}_${names[$i]}" "page=$i$extra" 12
          done

          # video: our own window moves across the screen (no Automation prompts needed)
          cat > /tmp/mover.py <<'PY'
          import sys, math
          from PySide6.QtWidgets import QApplication, QWidget
          from PySide6.QtCore import QTimer
          app = QApplication(sys.argv)
          w = QWidget()
          w.setWindowTitle("Mover")
          w.resize(460, 300)
          w.setStyleSheet("background:#eeeeee")
          w.move(80, 140)
          w.show()
          n = [0]
          def step():
              n[0] += 1
              w.move(int(80 + n[0] * 7), int(140 + 70 * math.sin(n[0] / 6.0)))
          tm = QTimer()
          tm.timeout.connect(step)
          tm.start(100)
          QTimer.singleShot(15000, app.quit)
          app.exec()
          PY
          SNOWFALL_DEMO="page=0,panel=0" ./dist/Snowfall.app/Contents/MacOS/Snowfall > report/move.log 2>&1 &
          APP=$!
          sleep 20
          .venv/bin/python /tmp/mover.py > report/mover.log 2>&1 &
          MOV=$!
          sleep 1
          mkdir -p report/frames
          screencapture -v -V 13 report/move.mov > report/video.log 2>&1 &
          REC=$!
          # запасной вариант: серия обычных скриншотов, если запись видео не получится
          for i in $(seq 1 40); do
            screencapture -x -t jpg report/frames/f$(printf %02d $i).jpg 2>>report/video.log || true
            sleep 0.1
          done
          wait $REC; echo "screencapture exit: $?" >> report/video.log
          ls -la report/move.mov >> report/video.log 2>&1 || echo "move.mov missing" >> report/video.log
          cat report/mover.log >> report/video.log 2>/dev/null
          kill $MOV $APP 2>/dev/null || true

      - name: Close-up crops
        continue-on-error: true
        run: |
          source .venv/bin/activate
          python - <<'PY' 2>&1 | tee report/crops.txt
          import sys
          from PySide6.QtWidgets import QApplication
          from PySide6.QtGui import QImage
          from PySide6.QtCore import Qt
          app = QApplication(sys.argv)
          import Snowfall as S
          sc = app.primaryScreen()
          img = QImage("report/base.png")
          k = img.width() / sc.geometry().width()
          print("screenshot", img.width(), "x", img.height(), "scale", k)
          def crop(name, cx, cy, w=70, h=44, z=8):
              x0 = max(0, int((cx - w / 2) * k)); y0 = max(0, int((cy - h / 2) * k))
              c = img.copy(x0, y0, int(w * k), int(h * k))
              c = c.scaled(c.width() * z, c.height() * z, Qt.KeepAspectRatio, Qt.SmoothTransformation)
              c.save("report/crop_" + name + ".png")
          ext = S.taskbar_extent(); tt = S.taskbar_top(); d = sc.devicePixelRatio()
          print("extent", ext, "top", tt)
          if ext and tt:
              ty = tt / d + 6
              crop("dock_left", ext[0] / d + 10, ty)
              crop("dock_right", ext[1] / d - 10, ty)
          wins = S.list_windows(set())
          for (wid, l, t, r, b) in wins[:4]:
              nm = (S.exe_of(wid) or str(wid)).replace(" ", "_")
              print("window", nm, l / d, t / d, r / d, b / d)
              crop(nm + "_left", l / d + 22, t / d + 12)
              crop(nm + "_right", r / d - 22, t / d + 12)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Snowfall-mac-${{ matrix.name }}
          path: |
            dist/Snowfall-mac.zip
            report/
